name: CI

on:
  pull_request:
    branches: [develop, master]
    # labeled/unlabeled: Die Labels skip-preview und skip-tests werden bei jedem Label-Wechsel neu ausgewertet
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Labels am PR (nur PRs nach develop; Pushes auf develop/master und Release-PRs nach master ignorieren sie):
#   skip-preview: keine Testumgebung (Image wird nur gebaut, nicht gepusht/ausgerollt)
#   skip-tests:   Job "test" wird übersprungen (zählt für required checks als erfüllt)
jobs:
  labels:
    # legt die Labels an, falls sie fehlen (idempotent)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const wanted = [
              ['skip-preview', 'Keine Testumgebung für diesen PR', 'c5def5'],
              ['skip-tests', 'Test-Suite für diesen PR überspringen (nur bei winzigen Änderungen)', 'fbca04'],
            ];
            const { owner, repo } = context.repo;
            for (const [name, description, color] of wanted) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch (e) { await github.rest.issues.createLabel({ owner, repo, name, description, color }); }
            }

  test:
    if: >-
      github.event_name != 'pull_request' || github.base_ref != 'develop' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-tests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx react-scripts test --watchAll=false
        env:
          CI: true
      - name: Build
        run: npm run build
        env:
          # Wie im Docker-Build: ESLint-Warnungen brechen den Build nicht ab
          CI: false

  skipped:
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'develop' &&
      (contains(github.event.pull_request.labels.*.name, 'skip-tests') || contains(github.event.pull_request.labels.*.name, 'skip-preview'))
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::Per Label übersprungen: tests=${{ contains(github.event.pull_request.labels.*.name, 'skip-tests') }}, preview=${{ contains(github.event.pull_request.labels.*.name, 'skip-preview') }}"

  docker:
    # ohne Tests und ohne Testumgebung gibt es keinen Grund, das Image zu bauen
    if: >-
      github.event_name != 'pull_request' || github.base_ref != 'develop' ||
      !(contains(github.event.pull_request.labels.*.name, 'skip-tests') && contains(github.event.pull_request.labels.*.name, 'skip-preview'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      preview: ${{ steps.meta.outputs.preview }}
      slug: ${{ steps.meta.outputs.slug }}
      legacy: ${{ steps.meta.outputs.legacy }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Testumgebung (deploy/PREVIEW.md): develop -> test.proxyprinter.eu, PR nach develop -> <slug>.test.proxyprinter.eu.
      # Slug = erste 6 Zeichen von sha256(Branch-Name), in beiden Repos gleich, so landen Backend- und Frontend-PR zusammen.
      # Ändert der PR (bzw. der Push auf develop) nur Doku, wird nichts gepusht und nichts ausgerollt.
      - id: meta
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.base_ref }}
          SKIP_PREVIEW: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip-preview') }}
          # PRs aus Forks bekommen keine Secrets und kein Schreibrecht auf ghcr.io: nur bauen und testen
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          slug=$(printf '%s' "$BRANCH" | sha256sum | cut -c1-6)
          # alter, langer Name aus der ersten Version, damit die Umgebung dort einmalig entfernt wird
          legacy=$(printf '%s' "$BRANCH" | sed 's#^claude/##' | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-40 | sed -E 's/-+$//')
          preview=false; tag=""; range=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            [ "$BASE" = develop ] && preview=true
            if [ "$SKIP_PREVIEW" = true ]; then
              echo "::notice::Label skip-preview, keine Testumgebung"
              preview=false
            fi
            if [ "$FORK" = true ]; then
              echo "::notice::PR aus einem Fork, keine Testumgebung"
              preview=false
            fi
            tag="br-$slug"; range="origin/$BASE...HEAD"
          elif [ "$BRANCH" = develop ]; then
            slug=develop; legacy=""; tag=develop; preview=true
            [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null && range="$BEFORE..HEAD"
          fi
          if [ "$preview" = true ] && [ -n "$range" ]; then
            changed=$(git diff --name-only "$range")
            if [ -n "$changed" ] && ! grep -qvE '(^|/)[^/]*\.md$|^docs/|^\.claude/|^archive/|^(LICENSE|TODO|\.gitignore)$' <<< "$changed"; then
              echo "::notice::Nur Doku geändert, keine Testumgebung"
              preview=false
            fi
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.meta.outputs.preview == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker-Image bauen (für Testumgebungen auch pushen)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker.dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.preview == 'true' }}
          tags: ghcr.io/${{ github.repository_owner }}/mtgprint-frontend:${{ steps.meta.outputs.tag || 'ci' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  preview:
    needs: [test, docker]
    # Tests per Label übersprungen (skipped) sind ok, fehlgeschlagene nicht
    if: always() && needs.docker.outputs.preview == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: preview-${{ needs.docker.outputs.slug }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Auf Testumgebung ausrollen
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          PROD_PATH: ${{ vars.DEPLOY_PATH || '/opt/proxyprinter' }}
          SLUG: ${{ needs.docker.outputs.slug }}
          LEGACY_SLUG: ${{ needs.docker.outputs.legacy }}
          NEW_TAG: ${{ needs.docker.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            printf 'export ACTION=deploy SIDE=frontend SLUG=%q NEW_TAG=%q PROD_PATH=%q\n' "$SLUG" "$NEW_TAG" "$PROD_PATH"
            printf 'export LEGACY_SLUG=%q\n' "$LEGACY_SLUG"
            printf 'export GHCR_USER=%q GHCR_TOKEN=%q\n' "$GITHUB_ACTOR" "$GHCR_TOKEN"
            cat .github/deploy/preview.sh
          } | ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
                "$VPS_USER@$VPS_HOST" 'f=$(mktemp) && cat > "$f" && bash "$f" < /dev/null; rc=$?; rm -f "$f"; exit $rc' | tee preview.log
          { grep -m1 '^PREVIEW_URL=' preview.log || true; } | cut -d= -f2- > preview-url.txt
      - name: Link im PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = require('fs').readFileSync('preview-url.txt', 'utf8').trim();
            if (!url) return; // Testumgebungen noch nicht eingerichtet
            const marker = '<!-- preview-url -->';
            const body = `${marker}\n**Testumgebung:** ${url}\n\nFrontend aus diesem PR (\`${{ needs.docker.outputs.tag }}\`), Backend aus dem Backend-PR mit gleichem Branch-Namen oder von develop. Wird nach Merge bzw. Schließen entfernt.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
