# nginx im Frontend-Image: liefert den React-Build aus und leitet /api an den Backend-Container weiter.
# TLS macht der vorgeschaltete Proxy (siehe mtgprint/deploy/proxy-nginx.conf).
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 50m;
    # Docker-DNS: Backend-IP wird neu aufgelöst, wenn der Backend-Container neu gestartet wurde
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        root /usr/share/nginx/html;

        location /api/ {
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
